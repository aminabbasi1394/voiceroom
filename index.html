<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VoiceRoom</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif;
}
body{
  margin:0;
  background:#0d111c;
  color:#fff;
}
button,input{
  font:inherit;
}
button{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  cursor:pointer;
  color:white;
  background:#5865f2;
  transition:.2s;
}
button:hover{background:#4752c4}
input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #30384e;
  border-radius:11px;
  outline:none;
  background:#1a2131;
  color:#fff;
}
input:focus{border-color:#7180ff}
.hidden{display:none!important}

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.login-card{
  width:100%;
  max-width:420px;
  background:#171e2d;
  border:1px solid #293247;
  border-radius:24px;
  padding:30px;
  text-align:center;
  box-shadow:0 15px 50px #0005;
}
.logo{
  font-size:38px;
  margin-bottom:5px;
}
.login-card h1{
  margin:8px 0;
  color:#8290ff;
}
.subtitle{
  color:#929bb1;
  font-size:13px;
  margin-bottom:25px;
}
.form-title{
  text-align:right;
  font-size:12px;
  color:#aeb8cc;
}
.buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.buttons button{flex:1}
#status{
  font-size:12px;
  color:#aeb8cc;
  line-height:1.8;
}

#app{
  display:none;
  min-height:100vh;
  padding:12px;
}
.topbar{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:#171e2d;
  border:1px solid #293247;
  padding:13px 16px;
  border-radius:16px;
}
.brand{
  font-size:18px;
  font-weight:bold;
  color:#8290ff;
}
.room-name{
  font-size:12px;
  color:#9ca8bf;
  margin-top:4px;
}
.top-actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.top-actions button{
  padding:9px 11px;
  font-size:12px;
}

.main{
  max-width:1150px;
  margin:12px auto;
  display:grid;
  grid-template-columns:270px 1fr;
  gap:12px;
}
.side,.content{
  background:#171e2d;
  border:1px solid #293247;
  border-radius:16px;
  padding:15px;
}
.section-title{
  color:#a9b5ff;
  font-size:14px;
  margin:5px 0 14px;
}
.player{
  display:flex;
  align-items:center;
  gap:9px;
  background:#222b3d;
  border-radius:11px;
  padding:11px;
  margin:8px 0;
  font-size:12px;
}
.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#5865f2;
  font-size:16px;
}
.player-info{
  flex:1;
}
.player-name{
  font-weight:bold;
}
.player-status{
  color:#8d99af;
  font-size:10px;
  margin-top:4px;
}
.crown{color:#ffd34e}

#messages{
  height:53vh;
  min-height:300px;
  overflow-y:auto;
  padding:8px;
  background:#0e1420;
  border-radius:12px;
}
.message{
  background:#252f43;
  border-radius:11px;
  padding:10px;
  margin:8px 0;
  font-size:13px;
  word-break:break-word;
}
.message b{color:#aab4ff}
.system{
  text-align:center;
  color:#8490a7;
  font-size:11px;
  margin:10px;
}
.send-box{
  display:flex;
  gap:7px;
  margin-top:10px;
}
.send-box input{margin:0}
.send-box button{margin:0}

.invite{
  background:#202a40;
  border-radius:12px;
  padding:12px;
  margin-top:15px;
}
.invite-title{
  font-size:12px;
  color:#b6c0ff;
  margin-bottom:8px;
}
.invite-link{
  direction:ltr;
  text-align:left;
  font-size:10px;
  color:#aab5c9;
  word-break:break-all;
  background:#101722;
  padding:9px;
  border-radius:8px;
}
.invite button{
  width:100%;
  margin:8px 0 0;
  font-size:12px;
}
#consoleLog{
  direction:ltr;
  text-align:left;
  font-size:10px;
  color:#8d99af;
  max-height:150px;
  overflow-y:auto;
  background:#0e1420;
  border-radius:8px;
  padding:8px;
}
audio{
  width:100%;
  margin:5px 0;
}
.small{
  color:#8995ac;
  font-size:10px;
  line-height:1.8;
}

@media(max-width:750px){
  .main{
    grid-template-columns:1fr;
  }
  .side{order:2}
  .content{order:1}
  .topbar{align-items:flex-start}
  .top-actions{width:100%}
  .top-actions button{flex:1}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen">
  <div class="login-card">
    <div class="logo">🎙️</div>
    <h1>VoiceRoom</h1>
    <div class="subtitle">
      وارد یک روم خصوصی شو و با دوستانت گفتگو کن
    </div>

    <div class="form-title">نام شما</div>
    <input id="name" placeholder="مثلاً امیر">

    <div class="form-title">کد روم</div>
    <input id="room" placeholder="مثلاً room123">

    <div class="buttons">
      <button onclick="createRoom()">🏠 ساخت روم</button>
      <button onclick="joinRoom()">🚪 ورود</button>
    </div>

    <p id="status">
      کد روم باید با حرف انگلیسی شروع شود.
    </p>
  </div>
</section>

<!-- APP -->
<section id="app">

  <header class="topbar">
    <div>
      <div class="brand">🎙️ VoiceRoom</div>
      <div class="room-name" id="roomTitle">روم</div>
    </div>

    <div class="top-actions">
      <button onclick="copyInvite()">🔗 دعوت</button>
      <button onclick="toggleMic()" id="micBtn">🎤 میکروفون</button>
      <button onclick="toggleAudio()" id="audioBtn">🔇 خاموش کردن صدا</button>
      <button onclick="leaveRoom()">🚪 خروج</button>
    </div>
  </header>

  <main class="main">

    <aside class="side">
      <h3 class="section-title">👥 اعضای روم</h3>
      <div id="playersList"></div>

      <div class="invite">
        <div class="invite-title">🔗 لینک دعوت روم</div>
        <div class="invite-link" id="inviteLink"></div>
        <button onclick="copyInvite()">📋 کپی لینک دعوت</button>
      </div>

      <h3 class="section-title" style="margin-top:20px">
        🛠 کنسول
      </h3>
      <div id="consoleLog"></div>
    </aside>

    <section class="content">
      <h3 class="section-title">💬 گفتگوی روم</h3>

      <div id="messages"></div>

      <div class="send-box">
        <input id="message"
               placeholder="پیامت رو بنویس..."
               onkeydown="handleEnter(event)">
        <button onclick="sendMessage()">ارسال</button>
      </div>

      <p class="small">
        برای صحبت صوتی، روی دکمه میکروفون بزن.
      </p>
    </section>

  </main>
</section>

<script>
const MAX_PLAYERS = 5;

let peer = null;
let myID = "";
let myName = "";
let roomCode = "";
let hostPeerId = "";
let isHost = false;

let players = {};
let connections = {};
let hostConnection = null;

let localStream = null;
let microphoneEnabled = false;
let calls = {};
let audioEnabled = true;

/* ابزارها */

const $ = id => document.getElementById(id);

function log(text){
  const time = new Date().toLocaleTimeString();
  $("consoleLog").innerHTML +=
    `<div>[${time}] ${escapeHTML(text)}</div>`;
  $("consoleLog").scrollTop = $("consoleLog").scrollHeight;
  console.log(text);
}

function escapeHTML(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function setStatus(text){
  $("status").textContent = text;
}

function normalizeRoomCode(value){
  const code = value.trim().toLowerCase();

  if(!/^[a-z][a-z0-9-]{2,39}$/.test(code)){
    throw new Error(
      "کد باید با حرف انگلیسی شروع شود و فقط شامل حروف انگلیسی، عدد و - باشد."
    );
  }

  return code;
}

/* لینک دعوت */

function getInviteLink(){
  return location.origin +
    location.pathname +
    "#room=" + encodeURIComponent(roomCode);
}

function updateInviteLink(){
  $("inviteLink").textContent = getInviteLink();
}

async function copyInvite(){
  const link = getInviteLink();

  try{
    await navigator.clipboard.writeText(link);
    addSystem("لینک دعوت کپی شد ✅");
  }catch(error){
    const temp = document.createElement("input");
    temp.value = link;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    temp.remove();
    addSystem("لینک دعوت کپی شد ✅");
  }
}

/* ورود خودکار از لینک */

function loadRoomFromURL(){
  const hash = location.hash;

  if(!hash.startsWith("#room=")) return;

  const code = decodeURIComponent(hash.substring(6));

  if(code){
    $("room").value = code;
    setStatus("کد روم از لینک دعوت وارد شد.");
  }
}

/* ساخت و ورود به روم */

function createRoom(){
  if(peer){
    try{ peer.destroy(); }catch(error){}
    peer = null;
  }

  const name = $("name").value.trim();

  if(!name){
    setStatus("لطفاً نام خود را وارد کنید.");
    return;
  }

  try{
    roomCode = normalizeRoomCode($("room").value);
  }catch(error){
    setStatus(error.message);
    return;
  }

  myName = name;
  hostPeerId = roomCode;
  isHost = true;
  players = {};
  connections = {};

  log("در حال ساخت روم...");
  createPeer(hostPeerId);
}

function joinRoom(){
  if(peer){
    try{ peer.destroy(); }catch(error){}
    peer = null;
  }

  const name = $("name").value.trim();

  if(!name){
    setStatus("لطفاً نام خود را وارد کنید.");
    return;
  }

  try{
    roomCode = normalizeRoomCode($("room").value);
  }catch(error){
    setStatus(error.message);
    return;
  }

  myName = name;
  hostPeerId = roomCode;
  isHost = false;
  players = {};
  connections = {};

  log("در حال اتصال به روم...");
  createPeer(null);
}

function createPeer(customID){
  peer = customID
    ? new Peer(customID,{debug:1})
    : new Peer(undefined,{debug:1});

  peer.on("open",id=>{
    myID = id;
    log("شناسه: " + id);

    if(isHost){
      players[myID] = {
        id:myID,
        name:myName,
        host:true
      };

      showApp();
      addSystem("روم با موفقیت ساخته شد ✅");
      updatePlayers();

    }else{
      hostConnection = peer.connect(hostPeerId,{
        reliable:true
      });

      setupConnection(hostConnection);

      const connectionTimeout = setTimeout(()=>{
        if(hostConnection && !hostConnection.open){
          log("زمان اتصال به میزبان تمام شد.");
          setStatus("روم پیدا نشد یا میزبان آنلاین نیست.");
          try{ hostConnection.close(); }catch(error){}
          if(peer){
            try{ peer.destroy(); }catch(error){}
            peer = null;
          }
        }
      },10000);

      hostConnection.on("open",()=>clearTimeout(connectionTimeout));
      addSystem("در حال اتصال به میزبان...");
    }
  });

  peer.on("connection",connection=>{
    if(isHost) setupConnection(connection);
  });

  peer.on("call",call=>{
    handleIncomingCall(call);
  });

  peer.on("error",error=>{
    log("خطا: " + error.type);

    if(error.type === "unavailable-id"){
      setStatus("این کد روم قبلاً استفاده شده است.");
    }else if(error.type === "peer-unavailable"){
      if(peer){
        try{
          peer.destroy();
        }catch(error){}
      }

      setStatus("روم پیدا نشد یا میزبان آنلاین نیست.");
      log("ورود به روم انجام نشد.");
    }else{
      setStatus("خطا در اتصال: " + error.type);
    }
  });
}

function showApp(){
  $("loginScreen").style.display = "none";
  $("app").style.display = "block";

  $("roomTitle").textContent = "روم: " + roomCode;
  updateInviteLink();
}

/* اتصالات */

function setupConnection(connection){
  if(!connection) return;

  connections[connection.peer] = connection;

  connection.on("open",()=>{
    log("اتصال برقرار شد.");

    if(isHost){
      connection.send({
        type:"welcome",
        hostID:myID,
        players:players
      });
    }else{
      connection.send({
        type:"join",
        name:myName
      });
    }
  });

  connection.on("data",data=>{
    if(isHost){
      handleHostData(data,connection);
    }else{
      handleGuestData(data);
    }
  });

  connection.on("close",()=>{
    const id = connection.peer;

    delete connections[id];

    if(!isHost && connection === hostConnection){
      hostConnection = null;
      log("اتصال با میزبان قطع شد.");
      setStatus("اتصال با میزبان قطع شد.");
      closeAllCalls();
      return;
    }

    if(isHost && players[id]){
      addSystem(players[id].name + " از روم خارج شد.");
      delete players[id];

      broadcast({
        type:"players",
        players:players
      });

      updatePlayers();
    }
  });

  connection.on("error",error=>{
    log("خطای اتصال: " + (error && error.message ? error.message : "نامشخص"));
  });
}

function handleHostData(data,connection){
  if(!data || !data.type) return;

  if(data.type === "join"){
    if(players[connection.peer]){
      return;
    }

    if(Object.keys(players).length >= MAX_PLAYERS){
      connection.send({type:"roomFull"});
      return;
    }

    players[connection.peer] = {
      id:connection.peer,
      name:String(data.name || "کاربر"),
      host:false
    };

    connection.send({
      type:"welcome",
      hostID:myID,
      players:players
    });

    broadcast({
      type:"players",
      players:players
    });

    broadcast({
      type:"system",
      message:players[connection.peer].name + " وارد روم شد."
    });

    updatePlayers();
  }

  if(data.type === "message"){
    addMessage(data.name,data.message);
    broadcast(data,connection.peer);
  }

  if(data.type === "leave"){
    delete players[connection.peer];

    broadcast({
      type:"players",
      players:players
    });

    updatePlayers();
  }
}

function handleGuestData(data){
  if(!data || !data.type) return;

  if(data.type === "welcome"){
    hostPeerId = data.hostID || hostPeerId;
    players = data.players || {};

    showApp();
    addSystem("با موفقیت وارد روم شدید ✅");
    updatePlayers();
    ensureVoiceConnections();
  }

  if(data.type === "players"){
    players = data.players || {};
    updatePlayers();
    ensureVoiceConnections();
  }

  if(data.type === "message"){
    addMessage(data.name,data.message);
  }

  if(data.type === "system"){
    addSystem(data.message);
  }

  if(data.type === "roomFull"){
    log("ظرفیت روم تکمیل است.");
    setStatus("ظرفیت روم تکمیل است.");
    if(hostConnection){
      try{ hostConnection.close(); }catch(error){}
      hostConnection = null;
    }
    if(peer){
      try{ peer.destroy(); }catch(error){}
      peer = null;
    }
  }
}

function broadcast(data,exceptID=null){
  Object.keys(connections).forEach(id=>{
    if(id === exceptID) return;

    const connection = connections[id];

    if(connection && connection.open){
      try{
        connection.send(data);
      }catch(error){
        log("ارسال ناموفق");
      }
    }
  });
}

/* اعضا */

function updatePlayers(){
  const list = $("playersList");
  list.innerHTML = "";

  Object.values(players).forEach(player=>{
    const div = document.createElement("div");
    div.className = "player";

    const firstLetter =
      String(player.name).charAt(0).toUpperCase();

    div.innerHTML = `
      <div class="avatar">${escapeHTML(firstLetter)}</div>
      <div class="player-info">
        <div class="player-name">
          ${escapeHTML(player.name)}
          ${player.host ? '<span class="crown"> 👑</span>' : ""}
        </div>
        <div class="player-status">
          ${player.host ? "میزبان" : "عضو روم"}
        </div>
      </div>
    `;

    list.appendChild(div);
  });
}

/* چت */

function sendMessage(){
  const input = $("message");
  const message = input.value.trim();

  if(!message) return;

  const data = {
    type:"message",
    name:myName,
    message:message
  };

  addMessage(myName,message);

  if(isHost){
    broadcast(data);
  }else if(hostConnection && hostConnection.open){
    hostConnection.send(data);
  }

  input.value = "";
  input.focus();
}

function handleEnter(event){
  if(event.key === "Enter") sendMessage();
}

function addMessage(name,message){
  const div = document.createElement("div");
  div.className = "message";

  div.innerHTML =
    `<b>${escapeHTML(name)}:</b> ${escapeHTML(message)}`;

  $("messages").appendChild(div);
  scrollMessages();
}

function addSystem(message){
  log(message);
}

function scrollMessages(){
  $("messages").scrollTop = $("messages").scrollHeight;
}

/* میکروفون */

async function toggleMic(){
  if(microphoneEnabled){
    stopMicrophone();
    return;
  }

  try{
    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:false
      });

    microphoneEnabled = true;
    $("micBtn").textContent = "🔇خاموش کردن میکروفون";

    addSystem("میکروفون فعال شد.");
    closeAllCalls();

    setTimeout(ensureVoiceConnections,500);

  }catch(error){
    addSystem("دسترسی به میکروفون داده نشد.");
    log(error.message);
  }
}

function stopMicrophone(){
  if(localStream){
    localStream.getTracks().forEach(track=>track.stop());
    localStream = null;
  }

  microphoneEnabled = false;
  $("micBtn").textContent = "🎤 میکروفون";

  closeAllCalls();
  addSystem("میکروفون خاموش شد.");
}

function ensureVoiceConnections(){
  if(!peer || !microphoneEnabled || !localStream) return;

  Object.keys(players).forEach(id=>{
    if(id === myID) return;

    if(!calls[id]){
      startCall(id);
    }
  });
}

function startCall(targetID){
  if(!peer || !localStream || calls[targetID]) return;

  const call = peer.call(targetID,localStream);

  if(!call) return;

  calls[targetID] = call;

  call.on("stream",stream=>{
    playAudio(targetID,stream);
  });

  call.on("close",()=>{
    delete calls[targetID];
    removeAudio(targetID);
  });

  call.on("error",()=>{
    delete calls[targetID];
    removeAudio(targetID);
  });
}

function handleIncomingCall(call){
  if(calls[call.peer]){
    call.close();
    return;
  }

  calls[call.peer] = call;
  call.answer(localStream || undefined);

  call.on("stream",stream=>{
    playAudio(call.peer,stream);
  });

  call.on("close",()=>{
    delete calls[call.peer];
    removeAudio(call.peer);
  });

  call.on("error",()=>{
    delete calls[call.peer];
    removeAudio(call.peer);
  });
}

function playAudio(id,stream){
  let audio = document.getElementById("audio-"+id);

  if(!audio){
    audio = document.createElement("audio");
    audio.id = "audio-"+id;
    audio.autoplay = true;
    audio.playsInline = true;
    audio.controls = false;
    audio.setAttribute("aria-hidden","true");
    audio.style.display = "none";

    document.body.appendChild(audio);
  }

  audio.srcObject = stream;

  if(audioEnabled){
    audio.play().catch(()=>{
      log("برای پخش صدا روی دکمه صدا بزنید.");
    });
  }
}

function removeAudio(id){
  const audio = document.getElementById("audio-"+id);

  if(audio){
    audio.srcObject = null;
    audio.remove();
  }
}

function closeAllCalls(){
  Object.keys(calls).forEach(id=>{
    try{
      calls[id].close();
    }catch(error){}

    removeAudio(id);
  });

  calls = {};
}

function toggleAudio(){
  audioEnabled = !audioEnabled;

  document.querySelectorAll('audio[id^="audio-"]').forEach(audio=>{
    audio.muted = !audioEnabled;

    if(audioEnabled){
      audio.play().catch(()=>{});
    }
  });

  const button = $("audioBtn");

  if(audioEnabled){
    button.textContent = "🔇 خاموش کردن صدا";
    addSystem("پخش صدا فعال شد.");
  }else{
    button.textContent = "🔊 روشن کردن صدا";
    addSystem("پخش صدا خاموش شد.");
  }
}

/* خروج */

function leaveRoom(){
  if(isHost){
    broadcast({
      type:"system",
      message:"میزبان روم را ترک کرد."
    });
  }else if(hostConnection && hostConnection.open){
    hostConnection.send({
      type:"leave"
    });
  }

  stopMicrophone();

  Object.values(connections).forEach(connection=>{
    try{
      connection.close();
    }catch(error){}
  });

  if(peer){
    try{
      peer.destroy();
    }catch(error){}
  }

  location.href = location.pathname;
}

/* شروع */

loadRoomFromURL();
</script>

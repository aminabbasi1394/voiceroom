<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceRoom</title>
<script src="https://unpkg.com/@metered-ca/realtime@1/dist/index.umd.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1220;color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0} .hidden{display:none!important}
#loginScreen{width:min(430px,calc(100% - 24px));margin:40px auto;padding:28px;border:1px solid #34415e;border-radius:24px;background:#171e30;box-shadow:0 20px 60px #0004}h1{color:#7180ff;text-align:center;margin:8px 0 10px;font-size:32px}.micIcon{text-align:center;font-size:44px}.subtitle{text-align:center;color:#b5bdd5;font-size:13px;margin-bottom:28px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#d9def0;margin-bottom:8px}.field input{width:100%;padding:13px;border:1px solid #3c4967;border-radius:12px;background:#192235;color:#fff;outline:none}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;padding:13px;border-radius:12px;background:#5968f4;color:#fff}.status{text-align:center;color:#cbd1e6;font-size:12px;min-height:20px;margin-top:16px}
#app{display:none;max-width:1100px;margin:auto;padding:16px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#171e30;border:1px solid #34415e;border-radius:16px;padding:14px}.topbar h2{margin:0;color:#8792ff;font-size:22px}.smallButton{background:#303c5b;color:#fff;border-radius:10px;padding:9px 12px}.layout{display:grid;grid-template-columns:1fr 300px;gap:14px;margin-top:14px}.panel{background:#171e30;border:1px solid #34415e;border-radius:16px;padding:14px;min-width:0}.panel h3{margin:0 0 12px;font-size:16px;color:#cbd2ff}.players{display:flex;flex-wrap:wrap;gap:10px;min-height:130px}.player{background:#202b43;border:1px solid #3b4a6c;border-radius:14px;padding:14px;min-width:130px;text-align:center}.player .avatar{font-size:30px}.player .name{margin-top:8px;word-break:break-word}.crown{color:#ffd45c}.chat{height:330px;overflow:auto;background:#101727;border-radius:12px;padding:10px}.message{padding:8px 10px;margin:6px 0;background:#26334f;border-radius:10px;word-break:break-word}.message b{color:#9ba5ff}.chatInput{display:flex;gap:8px;margin-top:10px}.chatInput input{flex:1;min-width:0;background:#192235;border:1px solid #3c4967;color:#fff;border-radius:10px;padding:11px}.chatInput button{background:#5968f4;color:#fff;border-radius:10px;padding:0 16px}.console{height:210px;overflow:auto;background:#090e18;border-radius:12px;padding:10px;font:12px Consolas,monospace;direction:ltr;text-align:left;color:#a9f2bf}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{background:#303c5b;color:#fff;border-radius:10px;padding:10px 13px}.controls button.active{background:#5968f4}.hint{font-size:12px;color:#aeb8d2;line-height:1.8;margin-top:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}#loginScreen{margin-top:20px}}
</style>
</head>
<body>
<section id="loginScreen">
  <div class="micIcon">🎙️</div>
  <h1>VoiceRoom</h1>
  <div class="subtitle">وارد یک روم خصوصی شو و با دوستانت گفتگو کن</div>
  <div class="field"><label for="name">نام شما</label><input id="name" placeholder="مثلاً امیر" maxlength="30"></div>
  <div class="field"><label for="room">کد روم</label><input id="room" placeholder="مثلاً room123" maxlength="40"></div>
  <div class="actions"><button id="joinBtn">ورود 🚪</button><button id="createBtn">ساخت روم 🏠</button></div>
  <div id="status" class="status"></div>
  <div class="hint">برای استفاده، ابتدا کلید Publishable متریِد را در کد قرار بده.</div>
</section>

<section id="app">
  <div class="topbar"><h2>🎙️ VoiceRoom <span id="roomTitle"></span></h2><button class="smallButton" id="leaveBtn">خروج</button></div>
  <div class="layout">
    <main>
      <div class="panel"><h3>👥 کاربران روم</h3><div id="players" class="players"></div></div>
      <div class="panel" style="margin-top:14px"><h3>💬 چت</h3><div id="chat" class="chat"></div><div class="chatInput"><input id="chatText" placeholder="پیامت را بنویس..." maxlength="500"><button id="sendBtn">ارسال</button></div></div>
      <div class="panel" style="margin-top:14px"><h3>🎛️ کنترل‌ها</h3><div class="controls"><button id="micBtn">🎤 میکروفون روشن</button><button id="audioBtn">🔊 پخش صدا روشن</button></div></div>
    </main>
    <aside>
      <div class="panel"><h3>🖥️ کنسول</h3><div id="console" class="console"></div></div>
    </aside>
  </div>
</section>

<script>
/* فقط Publishable Key متریِد را اینجا قرار بده. کلید Secret را هرگز داخل این فایل نگذار. */
const METERED_API_KEY = "pk_live_c5fd9585879fec36158a127251bbab3415d93cdf";

const $ = id => document.getElementById(id);
let meteredPeer = null;
let localStream = null;
let roomCode = "";
let myName = "";
let isHost = false;
let micEnabled = true;
let audioEnabled = true;
let joined = false;
const users = new Map();
const remoteAudios = new Map();

function setStatus(text){ $("status").textContent = text || ""; }
function log(text){
  const line = document.createElement("div");
  line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  $("console").appendChild(line);
  $("console").scrollTop = $("console").scrollHeight;
}
function errorText(error){
  if(!error) return "خطای نامشخص";
  if(error.err) error = error.err;
  return String(error.message || error.reason || error.code || error);
}
function addChat(name,text){
  const row = document.createElement("div");
  row.className = "message";
  const b = document.createElement("b");
  b.textContent = name + ": ";
  row.appendChild(b);
  row.appendChild(document.createTextNode(text));
  $("chat").appendChild(row);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function renderUsers(){
  $("players").innerHTML = "";
  users.forEach(user=>{
    const card = document.createElement("div");
    card.className = "player";
    const avatar = document.createElement("div"); avatar.className="avatar"; avatar.textContent="👤";
    const name = document.createElement("div"); name.className="name";
    name.textContent = user.name || "کاربر";
    if(user.host) name.innerHTML += ' <span class="crown">👑</span>';
    card.append(avatar,name);
    $("players").appendChild(card);
  });
}
function showApp(){ $("loginScreen").style.display="none"; $("app").style.display="block"; }
function showLogin(){ $("app").style.display="none"; $("loginScreen").style.display="block"; }
function cleanAudio(id){
  const audio = remoteAudios.get(id);
  if(audio){ audio.srcObject=null; audio.remove(); remoteAudios.delete(id); }
}
function attachRemote(remote){
  remote.on("stream-added", ({stream})=>{
    let audio = remoteAudios.get(remote.id);
    if(!audio){
      audio = document.createElement("audio");
      audio.autoplay = true;
      audio.playsInline = true;
      audio.style.display = "none";
      document.body.appendChild(audio);
      remoteAudios.set(remote.id,audio);
    }
    audio.srcObject = stream;
    audio.muted = !audioEnabled;
    audio.play().catch(()=>log("برای پخش صدا یک بار روی صفحه لمس/کلیک کن."));
    log("صدای کاربر دریافت شد: " + remote.id);
  });
}
function introduce(){
  if(!meteredPeer || !joined) return;
  meteredPeer.send({type:"introduce",name:myName,host:isHost}).catch(e=>log("ارسال اطلاعات کاربر: "+errorText(e)));
}
function createMeteredPeer(){
  if(!window.MeteredPeer) throw new Error("کتابخانه Metered بارگذاری نشده است.");
  // در UMD فعلی کلاس MeteredPeer داخل window.MeteredPeer قرار دارد.
  const PeerClass = window.MeteredPeer.MeteredPeer || window.MeteredPeer;
  if(typeof PeerClass !== "function") throw new Error("کلاس MeteredPeer پیدا نشد.");
  return new PeerClass({apiKey:METERED_API_KEY});
}
function setupMeteredEvents(){
  meteredPeer.on("peer-joined", ({peer})=>{
    log("کاربر جدید متصل شد: " + peer.id);
    users.set(peer.id,{id:peer.id,name:"کاربر جدید",host:false});
    renderUsers();
    attachRemote(peer);
    introduce();
  });
  meteredPeer.on("peer-left", ({peer})=>{
    log("کاربر خارج شد: " + peer.id);
    users.delete(peer.id);
    cleanAudio(peer.id);
    renderUsers();
  });
  meteredPeer.on("data", ({senderPeerId,data})=>{
    if(!data || typeof data !== "object") return;
    if(data.type === "introduce"){
      users.set(senderPeerId,{id:senderPeerId,name:String(data.name||"کاربر"),host:!!data.host});
      renderUsers();
      return;
    }
    if(data.type === "chat") addChat(String(data.name||"کاربر"),String(data.text||""));
  });
  meteredPeer.on("joined", ({peerId})=>{
    log("عضویت در روم تأیید شد: " + (peerId || "OK"));
  });
  meteredPeer.on("state-change", ({to})=>{
    log("وضعیت اتصال: " + to);
  });
  meteredPeer.on("error", error=>{
    const msg = errorText(error);
    log("خطای Metered: " + msg);
    setStatus("خطای Metered: " + msg);
  });
}
async function enterRoom(hostMode){
  const name=$("name").value.trim();
  const room=$("room").value.trim();
  if(!name){setStatus("لطفاً نام خود را وارد کن."); $("name").focus(); return;}
  if(!room){setStatus("لطفاً کد روم را وارد کن."); $("room").focus(); return;}
  if(!METERED_API_KEY || METERED_API_KEY.includes("REPLACE_WITH_YOUR")){
    setStatus("کلید Publishable متریِد هنوز داخل کد قرار نگرفته است.");
    log("کلید Metered تنظیم نشده است.");
    return;
  }
  if(!window.isSecureContext){
    setStatus("این سایت باید با HTTPS باز شود؛ GitHub Pages باید با https:// باشد.");
    log("Secure Context فعال نیست.");
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus("مرورگر اجازه دسترسی به میکروفون را نمی‌دهد.");
    log("getUserMedia در این مرورگر در دسترس نیست.");
    return;
  }
  try{
    if(meteredPeer){ try{await meteredPeer.leave?.();}catch(e){} meteredPeer=null; }
    myName=name; roomCode=room; isHost=hostMode;
    setStatus("در حال ساخت/ورود به روم...");
    log("شروع اتصال به Metered...");
    meteredPeer=createMeteredPeer();
    setupMeteredEvents();

    setStatus("در حال گرفتن مجوز میکروفون...");
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    localStream.getAudioTracks().forEach(t=>t.enabled=micEnabled);
    meteredPeer.addStream(localStream);

    setStatus("در حال ورود به روم...");
    await meteredPeer.join("voiceroom-"+roomCode);
    joined=true;
    users.clear();
    users.set("local",{id:"local",name:myName,host:isHost});
    renderUsers();
    $("roomTitle").textContent="— "+roomCode+(isHost?" 👑":"");
    showApp();
    setStatus("");
    log(isHost ? "روم ساخته شد و وارد آن شدی." : "با موفقیت وارد روم شدی.");
    introduce();
  }catch(error){
    const msg=errorText(error);
    log("خطا در ساخت/ورود به روم: "+msg);
    setStatus("روم ساخته نشد: "+msg);
    joined=false;
    if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
    if(meteredPeer){try{await meteredPeer.leave?.();}catch(e){} meteredPeer=null;}
  }
}
function toggleMic(){
  micEnabled=!micEnabled;
  if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=micEnabled);
  $("micBtn").textContent=micEnabled?"🎤 میکروفون روشن":"🔇 میکروفون خاموش";
  log(micEnabled?"میکروفون روشن شد":"میکروفون خاموش شد");
}
function toggleAudio(){
  audioEnabled=!audioEnabled;
  remoteAudios.forEach(audio=>audio.muted=!audioEnabled);
  $("audioBtn").textContent=audioEnabled?"🔊 پخش صدا روشن":"🔇 پخش صدا خاموش";
  log(audioEnabled?"پخش صدا روشن شد":"پخش صدا خاموش شد");
}
async function sendChat(){
  const input=$("chatText"); const text=input.value.trim();
  if(!text || !meteredPeer || !joined) return;
  addChat(myName,text);
  try{ await meteredPeer.send({type:"chat",name:myName,text}); input.value=""; }
  catch(e){log("خطای ارسال پیام: "+errorText(e));}
}
async function leaveRoom(){
  try{if(meteredPeer) await meteredPeer.leave?.();}catch(e){}
  joined=false;
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  remoteAudios.forEach(audio=>audio.remove()); remoteAudios.clear(); users.clear(); meteredPeer=null;
  $("chat").innerHTML=""; $("console").innerHTML=""; showLogin(); setStatus("از روم خارج شدی.");
}
$("createBtn").addEventListener("click",()=>enterRoom(true));
$("joinBtn").addEventListener("click",()=>enterRoom(false));
$("micBtn").addEventListener("click",toggleMic);
$("audioBtn").addEventListener("click",toggleAudio);
$("sendBtn").addEventListener("click",sendChat);
$("chatText").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat();});
$("leaveBtn").addEventListener("click",leaveRoom);
</script>
</body>
</html>

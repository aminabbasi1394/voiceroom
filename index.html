<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VoiceRoom</title>
<script src="https://cdn.jsdelivr.net/npm/@metered-ca/realtime@1.2.0/dist/index.umd.js"></script>

<style>
*{
  box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif;
}
body{
  margin:0;
  background:#0d111c;
  color:#fff;
}
button,input{
  font:inherit;
}
button{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  cursor:pointer;
  color:white;
  background:#5865f2;
  transition:.2s;
}
button:hover{background:#4752c4}
input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #30384e;
  border-radius:11px;
  outline:none;
  background:#1a2131;
  color:#fff;
}
input:focus{border-color:#7180ff}
.hidden{display:none!important}

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.login-card{
  width:100%;
  max-width:420px;
  background:#171e2d;
  border:1px solid #293247;
  border-radius:24px;
  padding:30px;
  text-align:center;
  box-shadow:0 15px 50px #0005;
}
.logo{
  font-size:38px;
  margin-bottom:5px;
}
.login-card h1{
  margin:8px 0;
  color:#8290ff;
}
.subtitle{
  color:#929bb1;
  font-size:13px;
  margin-bottom:25px;
}
.form-title{
  text-align:right;
  font-size:12px;
  color:#aeb8cc;
}
.buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.buttons button{flex:1}
#status{
  font-size:12px;
  color:#aeb8cc;
  line-height:1.8;
}

#app{
  display:none;
  min-height:100vh;
  padding:12px;
}
.topbar{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:#171e2d;
  border:1px solid #293247;
  padding:13px 16px;
  border-radius:16px;
}
.brand{
  font-size:18px;
  font-weight:bold;
  color:#8290ff;
}
.room-name{
  font-size:12px;
  color:#9ca8bf;
  margin-top:4px;
}
.top-actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.top-actions button{
  padding:9px 11px;
  font-size:12px;
}

.main{
  max-width:1150px;
  margin:12px auto;
  display:grid;
  grid-template-columns:270px 1fr;
  gap:12px;
}
.side,.content{
  background:#171e2d;
  border:1px solid #293247;
  border-radius:16px;
  padding:15px;
}
.section-title{
  color:#a9b5ff;
  font-size:14px;
  margin:5px 0 14px;
}
.player{
  display:flex;
  align-items:center;
  gap:9px;
  background:#222b3d;
  border-radius:11px;
  padding:11px;
  margin:8px 0;
  font-size:12px;
}
.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#5865f2;
  font-size:16px;
}
.player-info{
  flex:1;
}
.player-name{
  font-weight:bold;
}
.player-status{
  color:#8d99af;
  font-size:10px;
  margin-top:4px;
}
.crown{color:#ffd34e}

#messages{
  height:53vh;
  min-height:300px;
  overflow-y:auto;
  padding:8px;
  background:#0e1420;
  border-radius:12px;
}
.message{
  background:#252f43;
  border-radius:11px;
  padding:10px;
  margin:8px 0;
  font-size:13px;
  word-break:break-word;
}
.message b{color:#aab4ff}
.system{
  text-align:center;
  color:#8490a7;
  font-size:11px;
  margin:10px;
}
.send-box{
  display:flex;
  gap:7px;
  margin-top:10px;
}
.send-box input{margin:0}
.send-box button{margin:0}

.invite{
  background:#202a40;
  border-radius:12px;
  padding:12px;
  margin-top:15px;
}
.invite-title{
  font-size:12px;
  color:#b6c0ff;
  margin-bottom:8px;
}
.invite-link{
  direction:ltr;
  text-align:left;
  font-size:10px;
  color:#aab5c9;
  word-break:break-all;
  background:#101722;
  padding:9px;
  border-radius:8px;
}
.invite button{
  width:100%;
  margin:8px 0 0;
  font-size:12px;
}
#consoleLog{
  direction:ltr;
  text-align:left;
  font-size:10px;
  color:#8d99af;
  max-height:150px;
  overflow-y:auto;
  background:#0e1420;
  border-radius:8px;
  padding:8px;
}
audio{
  width:100%;
  margin:5px 0;
}
.small{
  color:#8995ac;
  font-size:10px;
  line-height:1.8;
}

@media(max-width:750px){
  .main{
    grid-template-columns:1fr;
  }
  .side{order:2}
  .content{order:1}
  .topbar{align-items:flex-start}
  .top-actions{width:100%}
  .top-actions button{flex:1}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen">
  <div class="login-card">
    <div class="logo">🎙️</div>
    <h1>VoiceRoom</h1>
    <div class="subtitle">
      وارد یک روم خصوصی شو و با دوستانت گفتگو کن
    </div>

    <div class="form-title">نام شما</div>
    <input id="name" placeholder="مثلاً امیر">

    <div class="form-title">کد روم</div>
    <input id="room" placeholder="مثلاً room123">

    <div class="buttons">
      <button onclick="createRoom()">🏠 ساخت روم</button>
      <button onclick="joinRoom()">🚪 ورود</button>
    </div>

    <p id="status">
      کد روم باید با حرف انگلیسی شروع شود.
    </p>
  </div>
</section>

<!-- APP -->
<section id="app">

  <header class="topbar">
    <div>
      <div class="brand">🎙️ VoiceRoom</div>
      <div class="room-name" id="roomTitle">روم</div>
    </div>

    <div class="top-actions">
      <button onclick="copyInvite()">🔗 دعوت</button>
      <button onclick="toggleMic()" id="micBtn">🎤 میکروفون</button>
      <button onclick="toggleAudio()" id="audioBtn">🔇 خاموش کردن صدا</button>
      <button onclick="leaveRoom()">🚪 خروج</button>
    </div>
  </header>

  <main class="main">

    <aside class="side">
      <h3 class="section-title">👥 اعضای روم</h3>
      <div id="playersList"></div>

      <div class="invite">
        <div class="invite-title">🔗 لینک دعوت روم</div>
        <div class="invite-link" id="inviteLink"></div>
        <button onclick="copyInvite()">📋 کپی لینک دعوت</button>
      </div>

      <h3 class="section-title" style="margin-top:20px">
        🛠 کنسول
      </h3>
      <div id="consoleLog"></div>
    </aside>

    <section class="content">
      <h3 class="section-title">💬 گفتگوی روم</h3>

      <div id="messages"></div>

      <div class="send-box">
        <input id="message"
               placeholder="پیامت رو بنویس..."
               onkeydown="handleEnter(event)">
        <button onclick="sendMessage()">ارسال</button>
      </div>

      <p class="small">
        برای صحبت صوتی، روی دکمه میکروفون بزن.
      </p>
    </section>

  </main>
</section>

<script>
const MAX_PLAYERS = 5;
const METERED_API_KEY = "pk_live_c5fd9585879fec36158a127251bbab3415d93cdf";

let peer = null;
let myID = "";
let myName = "";
let roomCode = "";
let isHost = false;
let joined = false;
let players = {};
let localStream = null;
let microphoneEnabled = false;
let audioEnabled = true;
let remotePeers = {};
let audioElements = {};

const $ = id => document.getElementById(id);

function log(text){
  const time = new Date().toLocaleTimeString();
  $("consoleLog").innerHTML += `<div>[${time}] ${escapeHTML(text)}</div>`;
  $("consoleLog").scrollTop = $("consoleLog").scrollHeight;
  console.log(text);
}

function escapeHTML(text){
  return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function setStatus(text){ $("status").textContent = text; }

function normalizeRoomCode(value){
  const code = value.trim().toLowerCase();
  if(!/^[a-z][a-z0-9-]{2,39}$/.test(code)){
    throw new Error("کد باید با حرف انگلیسی شروع شود و فقط شامل حروف انگلیسی، عدد و - باشد.");
  }
  return code;
}

function getInviteLink(){ return location.origin + location.pathname + "#room=" + encodeURIComponent(roomCode); }
function updateInviteLink(){ $("inviteLink").textContent = getInviteLink(); }

async function copyInvite(){
  const link = getInviteLink();
  try{ await navigator.clipboard.writeText(link); log("لینک دعوت کپی شد ✅"); }
  catch(error){
    const temp = document.createElement("input"); temp.value = link; document.body.appendChild(temp); temp.select();
    document.execCommand("copy"); temp.remove(); log("لینک دعوت کپی شد ✅");
  }
}

function loadRoomFromURL(){
  if(!location.hash.startsWith("#room=")) return;
  const code = decodeURIComponent(location.hash.substring(6));
  if(code){ $("room").value = code; setStatus("کد روم از لینک دعوت وارد شد."); }
}

function createRoom(){
  const name = $("name").value.trim();
  if(!name){ setStatus("لطفاً نام خود را وارد کنید."); return; }
  try{ roomCode = normalizeRoomCode($("room").value); }
  catch(error){ setStatus(error.message); return; }
  myName = name; isHost = true; startMeteredRoom();
}

function joinRoom(){
  const name = $("name").value.trim();
  if(!name){ setStatus("لطفاً نام خود را وارد کنید."); return; }
  try{ roomCode = normalizeRoomCode($("room").value); }
  catch(error){ setStatus(error.message); return; }
  myName = name; isHost = false; startMeteredRoom();
}

async function startMeteredRoom(){
  if(peer){ log("اتصال قبلی هنوز فعال است."); return; }
  setStatus("در حال اتصال به سرور، لطفاً صبر کنید...");
  log("در حال اتصال به Metered...");

  try{
    if(typeof MeteredPeer === "undefined") throw new Error("کتابخانه Metered بارگذاری نشده است.");
    peer = new MeteredPeer({ apiKey: METERED_API_KEY });
    registerMeteredEvents();
    await peer.join("room-" + roomCode);
    myID = peer.peerId || "";
    joined = true;
    showApp();
    setStatus("اتصال برقرار شد.");
    log("به روم متصل شدید: " + roomCode);
    announcePresence();
  }catch(error){
    log("خطای اتصال: " + (error.message || error));
    setStatus("اتصال برقرار نشد. کنسول را بررسی کنید.");
    cleanupPeer();
  }
}

function registerMeteredEvents(){
  peer.on("joined", event=>{
    myID = event.peerId || peer.peerId || myID;
    log("شناسه کاربر: " + myID);
  });

  peer.on("peer-joined", ({peer: remote})=>{
    if(!remote) return;
    remotePeers[remote.id] = remote;
    log("یک کاربر به روم متصل شد.");
    bindRemotePeer(remote);
    announcePresence();
  });

  peer.on("peer-left", remote=>{
    const id = remote && (remote.id || remote.peerId);
    if(id){ delete remotePeers[id]; delete players[id]; removeAudio(id); updatePlayers(); log("یک کاربر از روم خارج شد."); }
  });

  peer.on("data", ({senderPeerId, data})=>{
    if(!data || typeof data !== "object") return;
    if(data.type === "hello"){
      players[senderPeerId] = {id:senderPeerId, name:String(data.name || "کاربر"), host:!!data.host};
      updatePlayers();
      if(data.host) isHost = isHost || false;
    }
    if(data.type === "message") addMessage(data.name, data.message);
  });

  peer.on("state-change", ({from,to})=> log("وضعیت اتصال: " + from + " → " + to));
  peer.on("error", error=>{ log("خطای Metered: " + (error.message || error)); setStatus("خطا در اتصال؛ کنسول را بررسی کنید."); });
  peer.on("stream-added", ({stream, metadata})=>{
    const id = metadata && metadata.peerId ? metadata.peerId : "remote-" + Math.random().toString(36).slice(2);
    playAudio(id, stream);
  });
}

function bindRemotePeer(remote){
  if(!remote || remote.__boundVoiceRoom) return;
  remote.__boundVoiceRoom = true;
  remote.on("stream-added", ({stream, metadata})=> playAudio(remote.id || remote.peerId, stream));
  remote.on("stream-removed", ()=> removeAudio(remote.id || remote.peerId));
}

async function announcePresence(){
  if(!peer || !joined) return;
  try{ await peer.send({type:"hello", name:myName, host:isHost}); }
  catch(error){ log("ارسال وضعیت ناموفق بود."); }
}

function showApp(){
  $("loginScreen").style.display = "none";
  $("app").style.display = "block";
  $("roomTitle").textContent = "روم: " + roomCode;
  updateInviteLink();
  updatePlayers();
}

function updatePlayers(){
  const list = $("playersList"); list.innerHTML = "";
  if(myID && !players[myID]) players[myID] = {id:myID,name:myName,host:isHost};
  Object.values(players).slice(0,MAX_PLAYERS).forEach(player=>{
    const div = document.createElement("div"); div.className = "player";
    const firstLetter = String(player.name).charAt(0).toUpperCase();
    div.innerHTML = `<div class="avatar">${escapeHTML(firstLetter)}</div><div class="player-info"><div class="player-name">${escapeHTML(player.name)} ${player.host ? '<span class="crown"> 👑</span>' : ""}</div><div class="player-status">${player.host ? "میزبان" : "عضو روم"}</div></div>`;
    list.appendChild(div);
  });
}

async function sendMessage(){
  const input = $("message"); const message = input.value.trim();
  if(!message || !peer || !joined) return;
  const data = {type:"message",name:myName,message};
  addMessage(myName,message);
  try{ await peer.send(data); }catch(error){ log("ارسال پیام ناموفق بود."); }
  input.value = ""; input.focus();
}
function handleEnter(event){ if(event.key === "Enter") sendMessage(); }
function addMessage(name,message){
  const div = document.createElement("div"); div.className = "message";
  div.innerHTML = `<b>${escapeHTML(name)}:</b> ${escapeHTML(message)}`;
  $("messages").appendChild(div); scrollMessages();
}
function scrollMessages(){ $("messages").scrollTop = $("messages").scrollHeight; }

async function toggleMic(){
  if(microphoneEnabled){ stopMicrophone(); return; }
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    microphoneEnabled = true; $("micBtn").textContent = "🔇خاموش کردن میکروفون";
    if(peer && joined) peer.addStream(localStream,{role:"voice"});
    log("میکروفون فعال شد.");
  }catch(error){ log("دسترسی به میکروفون داده نشد: " + error.message); }
}

function stopMicrophone(){
  if(localStream) localStream.getTracks().forEach(track=>track.stop());
  localStream = null; microphoneEnabled = false; $("micBtn").textContent = "🎤 میکروفون";
  log("میکروفون خاموش شد.");
}

function playAudio(id,stream){
  if(!id || !stream) return;
  let audio = audioElements[id];
  if(!audio){
    audio = document.createElement("audio"); audio.autoplay = true; audio.playsInline = true; audio.controls = false;
    audio.style.display = "none"; document.body.appendChild(audio); audioElements[id] = audio;
  }
  audio.srcObject = stream; audio.muted = !audioEnabled;
  if(audioEnabled) audio.play().catch(()=>log("برای پخش صدا، دکمه روشن کردن صدا را بزنید."));
}
function removeAudio(id){
  const audio = audioElements[id];
  if(audio){ audio.srcObject = null; audio.remove(); delete audioElements[id]; }
}

function toggleAudio(){
  audioEnabled = !audioEnabled;
  Object.values(audioElements).forEach(audio=>{ audio.muted = !audioEnabled; if(audioEnabled) audio.play().catch(()=>{}); });
  $("audioBtn").textContent = audioEnabled ? "🔇 خاموش کردن صدا" : "🔊 روشن کردن صدا";
  log(audioEnabled ? "پخش صدا فعال شد." : "پخش صدا خاموش شد.");
}

function cleanupPeer(){
  try{ if(peer) peer.close(); }catch(error){}
  peer = null; joined = false; remotePeers = {}; players = {}; stopMicrophone();
}

function leaveRoom(){
  log("از روم خارج شدید.");
  cleanupPeer();
  Object.keys(audioElements).forEach(removeAudio);
  location.href = location.pathname;
}

loadRoomFromURL();
</script>

</body>
</html>
